<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telugu Fonts – Direct TTF/OTF Download | AiTechApp</title>
<meta name="description" content="Live Telugu font preview with direct TTF/OTF download.">
<meta name="theme-color" content="#f2f2f7">
<style>
:root{--b:#0a84ff;--bg:#f2f2f7;--card:#fff;--t:#1c1c1e;--m:#8e8e93;--bd:rgba(60,60,67,.12)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:18px}
header{position:sticky;top:0;z-index:5;height:64px;padding:10px 14px;display:flex;align-items:center;gap:10px;background:rgba(242,242,247,.94);backdrop-filter:blur(16px);border-bottom:.5px solid var(--bd)}
.back{width:42px;height:42px;border:0;border-radius:50%;background:rgba(118,118,128,.12);font-size:28px;text-decoration:none;color:var(--t);display:grid;place-items:center}
.title{flex:1}.title h1{font-size:20px;margin:0}.title p{font-size:10px;margin:2px 0 0;color:#087ccc;font-weight:900;letter-spacing:.6px}
#count{min-width:50px;padding:7px 10px;border-radius:16px;background:rgba(175,82,222,.12);color:#af52de;text-align:center;font-weight:900}
main{padding:8px}
.label{font-size:9px;font-weight:900;color:var(--m);margin:0 4px 3px;text-transform:uppercase;letter-spacing:.4px}
#previewInput{width:100%;height:41px;border:1px solid var(--bd);border-radius:14px;background:#fff;padding:8px 12px;resize:none;outline:none;font-size:16px;overflow:hidden;white-space:nowrap}
#list{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:6px 7px 5px;box-shadow:0 2px 9px rgba(0,0,0,.045)}
.line1{display:flex;align-items:center;gap:6px;font-size:12px;min-height:22px;white-space:nowrap;overflow:hidden}
.line1 strong{overflow:hidden;text-overflow:ellipsis}.line1 span:last-child{color:var(--m);overflow:hidden;text-overflow:ellipsis}
.serial{flex:none;min-width:30px;height:21px;border-radius:8px;display:grid;place-items:center;background:rgba(10,132,255,.09);color:#0780db;font-size:10px;font-weight:950}
.preview{height:27px;display:flex;align-items:center;padding:0 3px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.download{width:100%;height:27px;border:0;border-radius:9px;background:var(--b);color:#fff;font-size:11px;font-weight:900}
.download:disabled{opacity:.6}
.note{font-size:10px;color:var(--m);text-align:center;padding:10px 6px}
</style>
<style id="dynamicFontFaces"></style>
</head>
<body>
<div class="app">
<header>
  <a class="back" href="index.html" aria-label="Back">‹</a>
  <div class="title"><h1>Telugu Fonts</h1><p>FREE DIRECT TTF / OTF</p></div>
  <div id="count">—</div>
</header>
<main>
  <div class="label">Type Telugu text to preview</div>
  <textarea id="previewInput" maxlength="220" spellcheck="false">తెలుగు అక్షరాలు అందమైన ఫాంట్స్</textarea>
  <section id="list" aria-live="polite"></section>
  <div class="note">Direct TTF/OTF only · no GitHub page redirect · no ZIP preview cards</div>
</main>
</div>
<script src="telugu-fonts-client.js"></script>
</body>
</html>
