name: Build Final Telugu Fonts ZIP
on:
  push:
    branches: [main]
    paths:
      - 'telugu-fonts.html'
      - 'telugu-fonts-client.js'
      - 'fonts-catalog.json'
      - '.github/workflows/package-telugu-fonts.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: package-final-telugu-fonts
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify catalog and preserve original five-button dock
        run: |
          python scripts/check_telugu_fonts_ui.py
          python - <<'PY'
          import json,re,pathlib
          root=pathlib.Path('.')
          doc=json.loads((root/'fonts-catalog.json').read_text())
          fonts=doc['fonts']
          assert len(fonts)==212, len(fonts)
          assert len([f for f in fonts if not f.get('pending_until_available')])==212
          assert doc['active_total_before_gist_upload']==169
          h=(root/'telugu-fonts.html').read_text()
          js=(root/'telugu-fonts-client.js').read_text()
          assert 'telugu-fonts-client.js?v=20261012-premium-speed-share' in h
          assert 'window.addEventListener("hashchange",handleDeepLink)' in js
          assert 'URL.createObjectURL(blob)' in js
          assert 'oncontextmenu="return false;"' in js
          assert not re.search(r'<a[^>]+href=["\']https?://raw\.githubusercontent\.com',h,re.I)
          print('Catalog and direct Blob download checks passed')
          PY
      - name: Validate 43 uploaded GIST TTF Unicode and SHA-1
        run: |
          python -m pip install "fonttools>=4.50,<5"
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from fontTools.ttLib import TTFont
          cat=json.loads(Path('fonts-catalog.json').read_text('utf-8'))
          rows=[f for f in cat['fonts'] if 'C-DAC GIST' in f.get('categories',[])]
          assert len(rows)==43, f'Expected 43 GIST faces, got {len(rows)}'
          assert all(f.get('pending_until_available') is False for f in rows)
          for f in rows:
              path=Path(f['target_path'])
              assert path.is_file(), f'Missing '+str(path)
              data=path.read_bytes()
              sha=hashlib.sha1(('blob '+str(len(data))).encode('ascii')+bytes([0])+data).hexdigest()
              assert sha==f['source_blob_sha']==f['validated_git_blob_sha'],f['id']
              ft=TTFont(path)
              assert any(t.isUnicode() and any(0x0C00<=cp<=0x0C7F for cp in t.cmap) for t in ft['cmap'].tables),f['id']
              ft.close()
          print('Validated 43 GIST binaries, hashes and Telugu cmap coverage')
          PY
      - name: JavaScript and share-feature regression checks
        run: |
          node --check telugu-fonts-client.js
          python - <<'PY'
          from pathlib import Path
          h=Path('telugu-fonts.html').read_text()
          j=Path('telugu-fonts-client.js').read_text()
          assert 'id="shareSheet"' in h and 'id="shareCardImage"' in h
          assert 'fontTask' in j or 'getPreviewJob' in j
          assert 'FONT_LIMIT' in j and 'IntersectionObserver' in j
          assert 'makeShareImage' in j and 'sendFontShare' in j
          assert 'navigator.share' in j and 'canvas.toBlob' in j
          assert 'URL.createObjectURL(blob)' in j
          assert 'oncontextmenu="return false;"' in j
          assert 'window.addEventListener("hashchange",handleDeepLink)' in j
          assert all(s in h for s in ('badge-1','badge-2','fab-circle','badge-3','badge-4'))
          print('Share image, font pool and dock contracts passed')
          PY
      - name: Rebuild Final ZIP
        run: python scripts/build_deployment_zip.py --output downloads/AiTechApp-Telugu-Fonts-Final.zip
      - name: Verify archive entries
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import pathlib
          archive=pathlib.Path('downloads/AiTechApp-Telugu-Fonts-Final.zip')
          with ZipFile(archive) as z:
              assert z.testzip() is None
              assert z.namelist()==['telugu-fonts.html','telugu-fonts-client.js','fonts-catalog.json']
              for file in z.namelist():
                  assert z.read(file)==pathlib.Path(file).read_bytes()
          print('Final ZIP validated:',archive.stat().st_size,'bytes')
          PY
      - name: Publish rebuilt ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AiTechApp-Telugu-Fonts-Final.zip
          if ! git diff --staged --quiet; then
            git commit -m "build: refresh AiTechApp Fonts Final ZIP [skip ci]"
            git push
          fi
